name: Check site

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check schedule time zones
        run: node scripts/test-time.mjs

      - name: Check content rules
        run: node scripts/check-content.mjs
